<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA / viewport — user-scalable=no + max-scale=1 prevents all pinch-zoom -->
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050605" />

    <!-- Standard PWA manifest -->
    <link rel="manifest" href="/poker-dealer/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/poker-dealer/favicon.svg" />

    <!-- ─── iOS / Safari PWA meta ─────────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Voice Poker" />
    <link rel="apple-touch-icon" href="/poker-dealer/favicon.svg" />

    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }

      /* Lock the layout — no scroll, no bounce, no zoom */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        /* manipulation: allows tap/double-tap but prevents pinch-zoom */
        touch-action: manipulation;
        background: #050605;
      }

      /* Prevent text selection during gameplay */
      #app {
        height: 100%;
        -webkit-user-select: none;
        user-select: none;
        /* Prevent callout (long-press menu) on iOS */
        -webkit-touch-callout: none;
      }

      /* Force all inputs to 16px min to prevent iOS Safari auto-zoom on focus */
      input, select, textarea {
        font-size: max(16px, 1em) !important;
      }
    </style>

    <title>Voice Poker Dealer</title>
    <script type="module" crossorigin src="/poker-dealer/assets/index-BpdK55uY.js"></script>
    <link rel="stylesheet" crossorigin href="/poker-dealer/assets/index-Bl1Vfh6H.css">
  </head>
  <body>
    <div id="app"></div>

    <script>
      // ── Prevent pinch-to-zoom on iOS (the viewport meta alone is not enough) ──
      document.addEventListener('gesturestart',  function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend',    function(e) { e.preventDefault(); }, { passive: false });

      // Prevent multi-touch zoom (two-finger spread)
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });

      // Prevent double-tap zoom on iOS (300ms delay hack)
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      // Register service worker for PWA offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
